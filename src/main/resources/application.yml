spring:
  config:
    activate:
      on-profile: develop
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 2
  datasource:
    url: jdbc:mysql://localhost:3306/connector?characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull
    username: root
    password: root